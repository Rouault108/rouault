name: ci-cd

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  NODE_VERSION: 24.14.1

jobs:
  detect-changes:
    name: detect-changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      content: ${{ steps.classify.outputs.content }}
      app: ${{ steps.classify.outputs.app }}
      build: ${{ steps.classify.outputs.build }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          fetch-depth: 0

      - name: test CI change detection
        run: python3 -m unittest discover -s scripts/ci -p "test_*.py"

      - id: classify
        name: classify changed files
        run: python3 scripts/ci/classify_changes.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: needs.detect-changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck-app:
    name: typecheck-app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: needs.detect-changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:app

  typecheck-node:
    name: typecheck-node
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: needs.detect-changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:node

  test-node:
    name: test-node
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes]
    if: needs.detect-changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:node

  test-ssr:
    name: test-ssr
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [detect-changes]
    if: needs.detect-changes.outputs.build == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:ssr

  test-browser:
    name: test-browser
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [detect-changes]
    if: needs.detect-changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm run test:browser

  test-storybook-meta:
    name: test-storybook-meta
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [detect-changes]
    if: needs.detect-changes.outputs.app == 'true'
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm run test:storybook:meta

  prebuild-gate:
    name: prebuild-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - detect-changes
      - lint
      - typecheck-app
      - typecheck-node
      - test-node
      - test-ssr
      - test-browser
      - test-storybook-meta
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: validate prerequisite results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
        run: python3 scripts/ci/validate_prebuild_needs.py

  test-storybook-smoke:
    name: test-storybook-smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - detect-changes
      - prebuild-gate
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.prebuild-gate.result == 'success' && needs.detect-changes.outputs.app == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')) }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: echo "ROUAULT_BUILD_LABEL=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:storybook:smoke

  test-e2e-production:
    name: test-e2e-production
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - detect-changes
      - prebuild-gate
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.prebuild-gate.result == 'success' && needs.detect-changes.outputs.app == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')) }}
    env:
      ROUAULT_MEDIA_BASE_URL: ${{ vars.ROUAULT_MEDIA_BASE_URL }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: echo "ROUAULT_BUILD_LABEL=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps
      - run: pnpm run test:e2e:production

  test-e2e-dev:
    name: test-e2e-dev
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs:
      - detect-changes
      - prebuild-gate
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.prebuild-gate.result == 'success' && needs.detect-changes.outputs.app == 'true' && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')) }}
    env:
      ROUAULT_MEDIA_BASE_URL: ${{ vars.ROUAULT_MEDIA_BASE_URL }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: echo "ROUAULT_BUILD_LABEL=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e:dev

  build-production:
    name: build-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - detect-changes
      - prebuild-gate
    if: ${{ !cancelled() && needs.detect-changes.result == 'success' && needs.prebuild-gate.result == 'success' && needs.detect-changes.outputs.build == 'true' }}
    env:
      ROUAULT_MEDIA_BASE_URL: ${{ vars.ROUAULT_MEDIA_BASE_URL }}
      REPOSITORY_ROUAULT_SITE_ORIGIN: ${{ vars.ROUAULT_SITE_ORIGIN }}
      REPOSITORY_ROUAULT_BASE_PATH: ${{ vars.ROUAULT_BASE_PATH }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: echo "ROUAULT_BUILD_LABEL=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: resolve production build site URL context
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF}" == "refs/heads/main" ]]; then
            if [[ -z "${REPOSITORY_ROUAULT_SITE_ORIGIN:-}" ]]; then
              echo "ROUAULT_SITE_ORIGIN is required for main production deployment builds." >&2
              exit 1
            fi

            echo "ROUAULT_SITE_ORIGIN=${REPOSITORY_ROUAULT_SITE_ORIGIN}" >> "$GITHUB_ENV"
          else
            echo "ROUAULT_SITE_ORIGIN=${REPOSITORY_ROUAULT_SITE_ORIGIN:-http://127.0.0.1:4173}" >> "$GITHUB_ENV"
          fi

          echo "ROUAULT_BASE_PATH=${REPOSITORY_ROUAULT_BASE_PATH:-}" >> "$GITHUB_ENV"
      - run: pnpm build:production
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: rouault-dist
          path: |
            dist
            .generated/media
          include-hidden-files: true

  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() }}
    needs:
      - detect-changes
      - prebuild-gate
      - test-storybook-smoke
      - test-e2e-production
      - test-e2e-dev
      - build-production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: validate required results
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: python3 scripts/ci/validate_required_needs.py

  deploy-production:
    name: deploy-production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs:
      - detect-changes
      - build-production
      - ci-required
    outputs:
      deployment-url: ${{ steps.deploy-cloudflare-pages.outputs.deployment-url }}
    if: >-
      ${{
        !cancelled()
        && needs.detect-changes.result == 'success'
        && needs.build-production.result == 'success'
        && needs.ci-required.result == 'success'
        && github.event_name == 'push'
        && github.ref == 'refs/heads/main'
        && needs.detect-changes.outputs.build == 'true'
      }}
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      ROUAULT_MEDIA_BASE_URL: ${{ vars.ROUAULT_MEDIA_BASE_URL }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
      CF_PAGES_PROJECT: ${{ vars.CF_PAGES_PROJECT }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - run: echo "ROUAULT_BUILD_LABEL=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
      - name: print deployment provenance
        run: |
          echo "GITHUB_SHA=${GITHUB_SHA}"
          echo "GITHUB_REF=${GITHUB_REF}"
          echo "GITHUB_REF_NAME=${GITHUB_REF_NAME}"
          echo "ROUAULT_BUILD_LABEL=${ROUAULT_BUILD_LABEL}"
      - uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: corepack enable
      - run: pnpm install --frozen-lockfile
      - name: validate production authority
        run: pnpm exec tsx scripts/deploy/production-authority-preflight.ts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: rouault-dist
          path: .
      - run: pnpm exec tsx scripts/upload-r2-media.ts
      - id: deploy-cloudflare-pages
        name: deploy Cloudflare Pages
        run: pnpm exec tsx scripts/deploy/deploy-cloudflare-pages.ts

  verify-production-deployment:
    name: verify-production-deployment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    needs:
      - detect-changes
      - ci-required
      - deploy-production
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: validate deployment result
        env:
          NEEDS_JSON: ${{ toJson(needs) }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: python3 scripts/ci/validate_deployment_needs.py
      - name: verify production runtime artifacts over HTTP
        if: ${{ needs.deploy-production.result == 'success' }}
        env:
          ACTUAL_DEPLOYMENT_URL: ${{ needs.deploy-production.outputs.deployment-url }}
          ROUAULT_SITE_ORIGIN: ${{ vars.ROUAULT_SITE_ORIGIN }}
          ROUAULT_BASE_PATH: ${{ vars.ROUAULT_BASE_PATH }}
        run: python3 scripts/ci/verify_production_artifacts_http.py

